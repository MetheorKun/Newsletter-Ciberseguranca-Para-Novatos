<title>Monitor Global de Cibersegurança</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--tx:#18202c;--mut:#5f6b7c;--bd:#e2e8f1;--ac:#2f7cf6;--sh:0 2px 8px rgba(20,40,80,.07);
--c1:#e5484d;--c2:#f08a24;--c3:#e0b422;--c4:#34b27b;
--b1:#fdecec;--b2:#fff1e3;--b3:#fff8dc;--b4:#e6f7ef}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f141c;--card:#18202b;--tx:#e9eef5;--mut:#9aa7b8;--bd:#2a3442;--ac:#6aa8ff;--sh:none;
--c1:#ff6b70;--c2:#ffa04d;--c3:#ecc94b;--c4:#4cd39a;--b1:#2b1b1f;--b2:#2b2119;--b3:#2a2617;--b4:#17281f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1180px;margin:0 auto;padding:22px 16px 50px}
header{margin-bottom:18px}
h1{font-size:1.7rem;margin:0 0 4px}
.sub{color:var(--mut);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--sh);border:1px solid var(--bd)}
.stat b{display:block;font-size:1.6rem}.stat span{color:var(--mut);font-size:.8rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 14px;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
input[type=search]{flex:1;min-width:180px;padding:10px 16px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
section{margin-top:26px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:10px 14px;border-radius:14px}
.sh h2{margin:0;font-size:1.1rem}.sh small{color:var(--mut)}
.sh .n{margin-left:auto;font-weight:700;border-radius:999px;padding:2px 12px;background:var(--card)}
.s1 .sh{background:var(--b1)}.s2 .sh{background:var(--b2)}.s3 .sh{background:var(--b3)}.s4 .sh{background:var(--b4)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:8px;border-top:5px solid var(--mut);min-height:230px;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.s1 .card{border-top-color:var(--c1)}.s2 .card{border-top-color:var(--c2)}.s3 .card{border-top-color:var(--c3)}.s4 .card{border-top-color:var(--c4)}
.top{display:flex;align-items:center;gap:8px;font-size:.74rem;color:var(--mut)}
.ico{font-size:1.5rem;line-height:1}
.tag{border:1px solid var(--bd);border-radius:999px;padding:1px 8px}
.card h3{margin:0;font-size:.98rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card p{margin:0;color:var(--mut);font-size:.85rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.76rem;color:var(--mut);gap:8px}
.foot a{background:var(--ac);color:#fff;text-decoration:none;border-radius:999px;padding:4px 12px;font-size:.78rem;white-space:nowrap}
.more{display:block;margin:14px auto 0}
.empty{text-align:center;color:var(--mut);padding:40px}
footer{color:var(--mut);font-size:.78rem;margin-top:30px;text-align:center}
</style>
</head>
